name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: build .deb + tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libssl-dev \
            dpkg-dev desktop-file-utils appstream

      - name: Fetch appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ref="$INPUT_VERSION"
          else
            ref="$REF_NAME"
          fi

          if [[ ! "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: '$ref' (expected vX.Y.Z)" >&2
            exit 1
          fi

          version="${ref#v}"
          workspace_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "$version" != "$workspace_version" ]]; then
            echo "tag $version does not match Cargo.toml ($workspace_version)" >&2
            exit 1
          fi

          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Build release binary
        run: cargo build --release -p ddcui-gpui

      - name: Report binary size
        run: |
          ls -lh target/release/ddcui-rs
          echo "### Binary size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh target/release/ddcui-rs >> "$GITHUB_STEP_SUMMARY"
          file target/release/ddcui-rs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate desktop file
        run: desktop-file-validate packaging/io.github.jerinshop7_maker.DdcuiRs.desktop

      - name: Validate metainfo
        run: appstreamcli validate --no-net packaging/io.github.jerinshop7_maker.DdcuiRs.metainfo.xml

      - name: Build packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash packaging/build-packages.sh "$VERSION"

      - name: Check the packages are complete
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          deb="dist/ddcui-rs_${VERSION}_amd64.deb"
          test -f "$deb"
          dpkg-deb --contents "$deb" | grep -q './usr/bin/ddcui-rs'
          dpkg-deb --contents "$deb" | grep -q './usr/share/ddcui-rs/plugins/gnome-quick-menu/plugin.json'

          tarball="dist/ddcui-rs-${VERSION}-x86_64-linux.tar.gz"
          test -f "$tarball"
          root="ddcui-rs-${VERSION}-x86_64-linux"
          tar tzf "$tarball" | grep -q "^${root}/ddcui-rs$"
          tar tzf "$tarball" | grep -q "^${root}/plugins/gnome-quick-menu/plugin.json$"

          appimage="dist/ddcui-rs-${VERSION}-x86_64.AppImage"
          test -f "$appimage"

          # The shipped binaries have to run: `--help` prints without a display.
          mkdir -p "$RUNNER_TEMP/check"
          tar xzf "$tarball" -C "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/$root/ddcui-rs" --help | head -5
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help | head -5

          echo "All three artifacts unpack and run"

      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.deb ./*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddcui-rs-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          files=()
          for f in dist/*.deb dist/*.tar.gz dist/*.AppImage dist/SHA256SUMS; do
            [ -e "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no build artifacts found" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            target=()
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${files[@]}" \
              --title "ddcui-rs $TAG" \
              --generate-notes "${target[@]}"
          fi
