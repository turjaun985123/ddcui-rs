name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: core

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p ddc-core --all-targets -- -D warnings

      - name: test
        run: cargo test -p ddc-core

  gui:
    name: gpui app (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gui

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libssl-dev

      - name: Who pulls xattr (informational)
        run: cargo tree -i xattr || true

      - name: Build
        run: cargo build -p ddcui-gpui --verbose

      - name: Clippy
        run: cargo clippy -p ddcui-gpui --all-targets -- -D warnings

      - name: Test
        run: cargo test -p ddcui-gpui

      - name: Strip the debug binary for the artifact
        run: |
          strip --strip-debug target/debug/ddcui-rs
          ls -la target/debug/ddcui-rs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ddcui-rs-debug-linux-x86_64
          path: target/debug/ddcui-rs
          if-no-files-found: error
          retention-days: 14

  plugins:
    name: desktop plugins (syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GJS only exists inside a GNOME Shell session, but the extension is
      # plain ESM: `node --check` catches syntax errors, and the manifests are
      # validated below as well as by `cargo test -p ddcui-gpui`.
      - name: GNOME Shell extension parses
        run: |
          set -euo pipefail
          cp packaging/plugins/gnome-quick-menu/files/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
          echo "extension.js parses as an ES module"

      - name: Manifests agree with each other
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("packaging/plugins/gnome-quick-menu")
          plugin = json.loads((root / "plugin.json").read_text())
          metadata = json.loads((root / "files" / "metadata.json").read_text())

          assert plugin["kind"] == "gnome-shell-extension", plugin
          assert plugin["uuid"] == metadata["uuid"], "uuid mismatch"
          assert "50" in metadata["shell-version"], metadata["shell-version"]
          for name in ("extension.js", "metadata.json"):
              assert (root / plugin.get("files", "files") / name).is_file(), name
          print(f"{plugin['id']}: {plugin['uuid']}, shell-version {metadata['shell-version']}")
          PY

      # The release workflow validates these too, but a broken entry should not
      # need a tag push to be noticed.
      - name: Desktop metadata is valid
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/io.github.jerinshop7_maker.DdcuiRs.desktop
          appstreamcli validate --no-net packaging/io.github.jerinshop7_maker.DdcuiRs.metainfo.xml
